{% extends "base.html" %}

{% block content %}
<h3 class="mb-4">Laporan Penjualan</h3>
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card bg-primary text-white shadow-sm">
            <div class="card-body"><h6>Total Omset (Lunas)</h6><h3 id="stat-income">Rp 0</h3></div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-success text-white shadow-sm">
            <div class="card-body"><h6>Total Keuntungan Bersih</h6><h3 id="stat-profit">Rp 0</h3></div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-info text-white shadow-sm">
            <div class="card-body"><h6>Total Transaksi</h6><h3 id="stat-count">0</h3></div>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
                <tr><th>Antrean</th><th>Tanggal</th><th>Detail Barang</th><th>Total</th><th>Status</th><th>Laba</th></tr>
            </thead>
            <tbody id="report-table-body"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", loadReports);

    function loadReports() {
        fetch('/api/reports').then(res => res.json()).then(data => {
            document.getElementById('stat-income').innerText = `Rp ${data.summary.total_income.toLocaleString('id-ID')}`;
            document.getElementById('stat-profit').innerText = `Rp ${data.summary.total_profit.toLocaleString('id-ID')}`;
            document.getElementById('stat-count').innerText = data.summary.total_transactions;

            const tbody = document.getElementById('report-table-body');
            tbody.innerHTML = '';
            data.transactions.forEach(t => {
                let itemsHtml = '<ul class="mb-0 ps-3">';
                t.items.forEach(i => {
                    itemsHtml += `<li>${i.product_name} x ${i.qty} (@Rp ${i.sell_price.toLocaleString('id-ID')})</li>`;
                });
                itemsHtml += '</ul>';

                const isPaid = t.payment_status === "Lunas";
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-center">#${t.queue_number}</td>
                        <td>${t.date}</td>
                        <td>${itemsHtml}</td>
                        <td>Rp ${t.total_amount.toLocaleString('id-ID')}</td>
                        <td><span class="badge ${isPaid ? 'bg-success' : 'bg-warning text-dark'}">${t.payment_status}</span></td>
                        <td class="text-success fw-bold">${isPaid ? 'Rp ' + t.total_profit.toLocaleString('id-ID') : '-'}</td>
                    </tr>`;
            });
        });
    }
</script>
{% endblock %}
